
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Détails du modèle IA - Church</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-models-body">

<main class="admin-models-container">

    <header class="admin-models-header">
        <div>
            <h1>
                <i class="bi bi-robot"></i>
                Détails du modèle IA
            </h1>
            <p>Consulte les informations de ce modèle.</p>
        </div>

        <a th:href="@{/admin/modeles-ia}"
           class="admin-models-button admin-button-secondary">
            <i class="bi bi-arrow-left"></i>
            Retour à la liste
        </a>
    </header>

    <section class="admin-models-card admin-details-card">

        <div class="admin-details-heading">
            <div class="admin-details-icon">
                <i class="bi bi-cpu"></i>
            </div>

            <div>
                <h2 th:text="${modeleIA.name}">Nom du modèle</h2>
                <span class="admin-provider-badge"
                      th:text="${modeleIA.provider.name}">
                    Fournisseur
                </span>
            </div>
        </div>

        <div class="admin-details-grid">

            <div class="admin-detail-item">
                <span class="admin-detail-label">
                    <i class="bi bi-hash"></i>
                    Identifiant
                </span>
                <p th:text="${modeleIA.id}"></p>
            </div>

            <div class="admin-detail-item">
                <span class="admin-detail-label">
                    <i class="bi bi-building"></i>
                    Fournisseur
                </span>
                <p th:text="${modeleIA.provider.name}"></p>
            </div>

            <div class="admin-detail-item admin-detail-full">
                <span class="admin-detail-label">
                    <i class="bi bi-link-45deg"></i>
                    URL de l'API
                </span>
                <p class="admin-detail-url" th:text="${modeleIA.urlApi}"></p>
            </div>

            <div class="admin-detail-item admin-detail-full">
                <span class="admin-detail-label">
                    <i class="bi bi-card-text"></i>
                    Description
                </span>
                <p class="admin-detail-description"
                   th:text="${modeleIA.descriptor}">
                </p>
            </div>

        </div>

        <div class="admin-form-actions">
            <a th:href="@{/admin/modeles-ia}"
               class="admin-models-button admin-button-secondary">
                Retour
            </a>

            <a th:href="@{/admin/modeles-ia/{id}/edit(id=${modeleIA.id})}"
               class="admin-models-button admin-button-primary">
                <i class="bi bi-pencil-square"></i>
                Modifier ce modèle
            </a>
        </div>

    </section>

</main>

</body>
</html>
