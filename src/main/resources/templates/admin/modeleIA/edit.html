
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Modifier un modèle IA - Church</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-models-body">

<main class="admin-models-container">

    <header class="admin-models-header">
        <div>
            <h1>
                <i class="bi bi-pencil-square"></i>
                Modifier un modèle IA
            </h1>
            <p>Modifie les informations du modèle sélectionné.</p>
        </div>

        <a th:href="@{/admin/modeles-ia}"
           class="admin-models-button admin-button-secondary">
            <i class="bi bi-arrow-left"></i>
            Retour à la liste
        </a>
    </header>

    <section class="admin-models-card admin-form-card">

        <div class="admin-models-card-header">
            <div>
                <h2>Informations du modèle</h2>
                <p>Modèle : <strong th:text="${modeleIA.name}"></strong></p>
            </div>
        </div>

        <form th:action="@{/admin/modeles-ia/{id}(id=${modeleIA.id})}"
              method="post"
              class="admin-model-form">

            <input type="hidden" name="_method" value="PUT">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="admin-form-group">
                <label for="name">Nom du modèle</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        th:value="${modeleIA.name}"
                        required
                >
            </div>

            <div class="admin-form-group">
                <label for="providerId">Fournisseur IA</label>

                <select id="providerId" name="providerId" required>
                    <option
                            th:each="fournisseur : ${fournisseursIA}"
                            th:value="${fournisseur.id}"
                            th:text="${fournisseur.name}"
                            th:selected="${fournisseur.id == modeleIA.provider.id}">
                    </option>
                </select>
            </div>

            <div class="admin-form-group">
                <label for="urlApi">URL de l'API</label>
                <input
                        type="url"
                        id="urlApi"
                        name="urlApi"
                        th:value="${modeleIA.urlApi}"
                        required
                >
                <small>Vérifie que l'adresse correspond bien à celle du fournisseur.</small>
            </div>

            <div class="admin-form-group">
                <label for="descriptor">Description</label>
                <textarea
                        id="descriptor"
                        name="descriptor"
                        rows="4"
                        th:text="${modeleIA.descriptor}"
                ></textarea>
            </div>

            <div class="admin-form-actions">
                <a th:href="@{/admin/modeles-ia}"
                   class="admin-models-button admin-button-secondary">
                    Annuler
                </a>

                <button type="submit"
                        class="admin-models-button admin-button-primary">
                    <i class="bi bi-check-lg"></i>
                    Enregistrer les modifications
                </button>
            </div>

        </form>
    </section>

</main>

</body>
</html>
