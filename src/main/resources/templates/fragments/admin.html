
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration - Church</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="background:#101027; color:white; padding:40px;">

<div style="max-width:1100px; margin:auto;">

    <h1 style="color:#A78BFA;">
        <i class="bi bi-shield-lock"></i>
        Administration Church
    </h1>

    <p style="color:#aaa;">Gestion de la plateforme</p>

    <div style="
        background:#211E42;
        padding:25px;
        border-radius:15px;
        margin:30px 0;
        max-width:300px;">

        <h3>Utilisateurs inscrits</h3>

        <h1 style="color:#A78BFA;"
            th:text="${nombreUtilisateurs}">0</h1>
    </div>

    <h2>Liste des utilisateurs</h2>

    <div style="overflow-x:auto;">
        <table style="
            width:100%;
            border-collapse:collapse;
            background:#211E42;
            border-radius:12px;">

            <thead>
            <tr style="color:#A78BFA; text-align:left;">
                <th style="padding:15px;">ID</th>
                <th style="padding:15px;">Pseudo</th>
                <th style="padding:15px;">Email</th>
                <th style="padding:15px;">Rôle</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="u : ${utilisateurs}"
                style="border-top:1px solid #39345F;">

                <td style="padding:15px;" th:text="${u.id}"></td>
                <td style="padding:15px;" th:text="${u.pseudo}"></td>
                <td style="padding:15px;" th:text="${u.email}"></td>

                <td style="padding:15px;"
                    th:text="${u.role.nom}"></td>
            </tr>
            </tbody>

        </table>
    </div>

    <a th:href="@{/}"
       style="
       display:inline-block;
       margin-top:30px;
       color:#A78BFA;
       text-decoration:none;">
        <i class="bi bi-arrow-left"></i>
        Retour au chatbot
    </a>

</div>

</body>
</html>
