
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Administration - Church</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" th:href="@{/images/Icone.png}">
</head>

<body class="admin-models-body">

<main class="admin-models-container">

    <header class="admin-models-header">
        <div>
            <h1>
                <i class="bi bi-shield-lock"></i>
                Administration Church
            </h1>
            <p>Bienvenue dans l'espace de gestion de la plateforme.</p>
        </div>

        <a th:href="@{/}"
           class="admin-models-button admin-button-secondary">
            <i class="bi bi-house"></i>
            Retour au chatbot
        </a>
    </header>

    <section class="admin-dashboard-stats">

        <article class="admin-stat-card">
            <div class="admin-stat-icon">
                <i class="bi bi-people"></i>
            </div>

            <div>
                <p>Utilisateurs inscrits</p>
                <h2 th:text="${nombreUtilisateurs}">0</h2>
            </div>
        </article>

        <a th:href="@{/admin/modeles-ia}"
           class="admin-stat-card admin-stat-link">
            <div class="admin-stat-icon">
                <i class="bi bi-robot"></i>
            </div>

            <div>
                <p>Gestion des modèles IA</p>
                <h2>Accéder</h2>
            </div>

            <i class="bi bi-arrow-right admin-stat-arrow"></i>
        </a>

    </section>

    <section class="admin-models-card admin-users-card">

        <div class="admin-models-card-header">
            <div>
                <h2>
                    <i class="bi bi-people"></i>
                    Liste des utilisateurs
                </h2>
                <p>Consulte les comptes inscrits sur Church.</p>
            </div>
        </div>

        <div class="admin-models-table-wrapper">

            <table class="admin-models-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Pseudo</th>
                    <th>Email</th>
                    <th>Rôle</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="u : ${utilisateurs}">
                    <td th:text="${u.id}"></td>
                    <td class="admin-user-name"
                        th:text="${u.pseudo}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="admin-role-badge"
                              th:text="${u.role.nom}">
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(utilisateurs)}">
                    <td colspan="4" class="admin-models-empty">
                        <i class="bi bi-person-x"></i>
                        <p>Aucun utilisateur inscrit.</p>
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </section>

    <footer class="admin-models-footer">

    </footer>

</main>

</body>
</html>
