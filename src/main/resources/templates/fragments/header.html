
<div xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="header"
     class="church-sidebar">

  <!-- LOGO -->
  <div class="sidebar-brand">
    <div class="church-logo">
      <img th:src="@{/images/logoIA.png}"
           alt="Logo Church"
           onerror="this.style.display='none'">
      <span>✦</span>
    </div>

    <div class="brand-text">
      <h2>Church</h2>
      <p>Votre chatbot multi-IA</p>
    </div>
  </div>

  <!-- NOUVELLE CONVERSATION -->
  <div class="sidebar-new-chat">
    <a th:href="@{/}" class="new-chat-button">
      <span class="new-chat-icon">＋</span>
      Nouvelle conversation
    </a>
  </div>

  <!-- HISTORIQUE -->
  <div class="sidebar-history">

    <div class="history-heading">
      <span>HISTORIQUE</span>
      <span class="history-icon">◷</span>
    </div>

    <div class="history-list">

      <div th:each="c : ${conversations}"
           class="history-item-container">

        <a th:href="@{/conversations/{id}(id=${c.id})}"
           th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''"
           class="history-item">

          <span class="history-item-icon">▤</span>

          <span class="history-item-title"
                th:text="${c.title}">
            Nouvelle conversation
          </span>
        </a>

        <!-- MENU TROIS POINTS -->
        <div class="conversation-menu">

          <button type="button"
                  class="conversation-menu-trigger"
                  aria-label="Options de la conversation"
                  aria-expanded="false">
            ⋮
          </button>

          <div class="conversation-menu-dropdown">

            <!-- ÉPINGLER / DÉSÉPINGLER -->
            <form th:action="@{/conversations/{id}/pin(id=${c.id})}"
                  method="post">

              <button type="submit"
                      class="conversation-menu-item">

                <i th:class="${c.pinned} ? 'bi bi-pin-fill' : 'bi bi-pin'"></i>

                <span th:text="${c.pinned} ? 'Désépingler' : 'Épingler'">
                  Épingler
                </span>

                <span class="menu-shortcut">P</span>
              </button>
            </form>


            <!-- RENOMMER -->
            <form th:action="@{/conversations/{id}/rename(id=${c.id})}"
                  method="post"
                  class="rename-conversation-form">

              <label class="rename-conversation-label">
                Nouveau titre
              </label>

              <input type="text"
                     name="title"
                     class="rename-conversation-input"
                     placeholder="Saisir le nouveau titre..."
                     maxlength="100"
                     required>

              <button type="submit"
                      class="conversation-menu-item">
                <i class="bi bi-pencil"></i>
                Renommer
              </button>

            </form>


            <!-- PARTAGER -->
            <button type="button"
                    class="conversation-menu-item share-conversation-button"
                    th:attr="data-url=@{/conversations/{id}(id=${c.id})}">

              <i class="bi bi-share"></i>
              Partager
            </button>

            <!-- VERROUILLER -->
            <button type="button"
                    class="conversation-menu-item"
                    data-action="lock">
              <i class="bi bi-lock"></i>
              Lock
            </button>

            <!-- PROJET -->
            <button type="button"
                    class="conversation-menu-item"
                    data-action="project">
              <i class="bi bi-folder"></i>
              Déplacer vers un projet
              <i class="bi bi-chevron-right menu-chevron"></i>
            </button>

            <div class="menu-divider"></div>

            <!-- ARCHIVER -->
            <button type="button"
                    class="conversation-menu-item"
                    data-action="archive">
              <i class="bi bi-archive"></i>
              Archiver
              <span class="menu-shortcut">A</span>
            </button>

            <!-- SUPPRIMER -->
            <form th:action="@{/conversations/{id}/delete(id=${c.id})}"
                  method="post"
                  onsubmit="return confirm('Supprimer définitivement cette conversation ?');">

              <button type="submit"
                      class="conversation-menu-item delete-menu-item">
                <i class="bi bi-trash"></i>
                Supprimer
              </button>
            </form>

          </div>
        </div>

      </div>

      <!-- HISTORIQUE VIDE -->
      <div th:if="${conversations == null or #lists.isEmpty(conversations)}"
           class="history-empty">
        Aucune conversation pour le moment.
      </div>

    </div>
  </div>

  <!-- BAS DE LA SIDEBAR -->
  <div class="sidebar-bottom">

    <!-- ADMINISTRATION : ADMIN UNIQUEMENT -->
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/admin}"
       class="church-bottom-link">
      <i class="bi bi-shield-lock"></i>
      <span>Administration</span>
    </a>

    <!-- PROFIL -->
    <a th:href="@{/profil}" class="church-bottom-link">
      <i class="bi bi-person-circle"></i>
      <span th:text="${utilisateur != null ? utilisateur.pseudo : 'Mon profil'}">
        Mon profil
      </span>
    </a>

    <!-- PARAMÈTRES -->
    <a th:href="@{/parametres}" class="church-bottom-link">
      <i class="bi bi-gear-fill"></i>
      <span>Paramètres</span>
    </a>

    <!-- DÉCONNEXION -->
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="church-bottom-link logout-button">
        <i class="bi bi-box-arrow-right"></i>
        <span>Se déconnecter</span>
      </button>
    </form>

  </div>

</div>
